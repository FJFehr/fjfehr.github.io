<!doctype html>
<!-- Scene preview: scrub a background scene through the day. Serve the repo (python3 -m http.server) and open
     /js/background/preview.html?scene=capetown. State lives in the URL hash, so a reload after an edit keeps your place. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene preview</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; position: sticky; top: 0; background: #111; }
  input[type=range] { flex: 1; min-width: 240px; }
  output { font-variant-numeric: tabular-nums; min-width: 4em; }
  button, select { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; }
  button[aria-pressed=true] { background: #a84a12; border-color: #a84a12; }
  canvas { display: block; width: 100%; height: auto; }
  small { color: #888; }
</style>
</head>
<body>
<div class="bar">
  <output id="hour"></output>
  <input id="slider" type="range" min="0" max="24" step="0.01">
  <span id="jumps"></span>
  <label>Mood <select id="mood"></select></label>
  <button id="play" aria-pressed="false">Play</button>
  <button id="sweep" aria-pressed="false">Sweep</button>
  <small>←/→ ±5 min · shift ±1 min · space play</small>
</div>
<canvas id="out"></canvas>
<script type="module">
const scene = new URLSearchParams(location.search).get("scene") || "capetown";
const mod = await import(`./${scene}.js?v=${Date.now()}`);
const { hash } = await import("./engine.js");
const { cols, rows, palette, ground } = mod.meta;
const P = palette.map((s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)));
const $ = (id) => document.getElementById(id);
const S = 6; // pixels per cell
const cv = $("out"), ctx = cv.getContext("2d");
cv.width = cols * S, cv.height = rows * S;
const R = { " ": 0, "·": 0.22, "•": 0.38, "●": 0.5 }; // dot radius per character, in cells

// state in the hash: hour, seed
const st = Object.assign({ hour: 19.5, seed: 0 }, Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
st.hour = +st.hour, st.seed = +st.seed;
const save = () => history.replaceState(null, "", "#" + new URLSearchParams({ hour: st.hour.toFixed(2), seed: st.seed }));

// the moods (capetown picks one of 4 by hash(day, 1)): the first seed giving each
const MOODS = ["orange", "rose", "gold", "fire"];
for (let m = 0; m < MOODS.length; m++) {
    let seed = 0;
    while (Math.floor(hash(seed, 1) * MOODS.length) !== m) seed++;
    $("mood").add(new Option(`${MOODS[m]} (day ${seed})`, seed));
}
$("mood").value = String(st.seed);
if ($("mood").value !== String(st.seed)) $("mood").add(new Option(`day ${st.seed}`, st.seed, true, true));

for (const [label, h] of [["Golden", 17.3], ["Ember", 18.4], ["Sunset", 19.25], ["Peak", 19.8], ["Afterglow", 20.1], ["Dusk", 20.5]]) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => setHour(h);
    $("jumps").append(b);
}

const fmt = (h) => { const m = Math.round(h * 60) % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const color = new Array(cols * rows);
const paint = (text) => {
    ctx.fillStyle = ground; ctx.fillRect(0, 0, cv.width, cv.height);
    const lines = text.split("\n");
    for (let r = 0; r < rows; r++) for (let x = 0; x < cols; x++) {
        const rad = R[lines[r][x]];
        if (!rad) continue;
        const c = P[color[r * cols + x]];
        ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
        ctx.beginPath(); ctx.arc((x + 0.5) * S, (r + 0.5) * S, rad * S, 0, 7); ctx.fill();
    }
};

// a scene instance starts at an hour; sweeping runs the clock fast (1.5 h per 20 s), else the hour holds still
let frame, t = 0, t0 = 0, playing = false, sweeping = false;
const SWEEP = 1.5 / 20;
const start = () => { frame = mod.default({ hour: st.hour, seed: st.seed, rate: sweeping ? SWEEP : 0 }); t0 = performance.now() - t * 1000; };
const draw = () => {
    const text = frame(t, { color });
    paint(text);
    $("hour").textContent = fmt(st.hour);
    $("slider").value = st.hour;
};
const setHour = (h) => { st.hour = ((h % 24) + 24) % 24; save(); start(); draw(); };

let base = st.hour, tSweep = 0;
const loop = (now) => {
    if (playing || sweeping) {
        t = (now - t0) / 1000;
        if (sweeping) st.hour = (base + (t - tSweep) * SWEEP) % 24;
        draw();
        if (sweeping) save();
    }
    requestAnimationFrame(loop);
};

let pending = null;
$("slider").oninput = (e) => { // rebuild at most once per frame while dragging
    if (sweeping) toggleSweep();
    pending = +e.target.value;
    requestAnimationFrame(() => { if (pending != null) setHour(pending), (pending = null); });
};
$("mood").onchange = (e) => { st.seed = +e.target.value; save(); start(); draw(); };
const togglePlay = () => { playing = !playing; $("play").setAttribute("aria-pressed", playing); t0 = performance.now() - t * 1000; };
const toggleSweep = () => {
    sweeping = !sweeping;
    $("sweep").setAttribute("aria-pressed", sweeping);
    base = st.hour, tSweep = t;
    // a sweep runs one instance with a fast clock from here; stopping rebuilds a still one at the hour reached
    frame = mod.default({ hour: sweeping ? base : st.hour, seed: st.seed, rate: sweeping ? SWEEP : 0 });
    if (sweeping) t = tSweep = 0, t0 = performance.now();
};
$("play").onclick = togglePlay;
$("sweep").onclick = toggleSweep;
addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === " ") e.preventDefault(), togglePlay();
    const step = (e.shiftKey ? 1 : 5) / 60;
    if (e.key === "ArrowRight") e.preventDefault(), setHour(st.hour + step);
    if (e.key === "ArrowLeft") e.preventDefault(), setHour(st.hour - step);
});

start(); draw(); requestAnimationFrame(loop);
</script>
</body>
</html>
