# Site Configuration
# This file contains all site metadata, layout, contacts, and design settings

# ===========================
# Site Metadata
# ===========================
site:
  name: "Fabio J. Fehr"
  footer_name: "Fabio J. Fehr"
  page_title: "🌞 Fabio J. Fehr"  # Browser tab title
  nationality_flags: "🇿🇦 🇨🇭"  # Optional: displayed under profile picture
  author_name_pattern: "F. Fehr"  # Pattern to bold in publication author lists
  google_scholar_url: "https://scholar.google.com/citations?user=WaZWY0wAAAAJ&hl=en"
  cv_path: "content/site/Fabio_J_Fehr_CV_2025.pdf"  # Path to CV/Resume PDF
  profile_picture_path: "content/site/profile_picture.jpg"  # Path to profile picture
  site_url: "https://fjfehr.github.io"  # Your GitHub Pages URL — no trailing slash (used for OG tags in blog posts)
  role:
    title: "Postdoctoral Researcher"
    affiliation: "Oxford University, TVG"

# ===========================
# Layout & Navigation
# ===========================
layout:
  header:
    navigation:
      - label: "Experience"
        href: "#timeline"
      - label: "Highlights"
        href: "#media-heading"
      - label: "Publications"
        href: "#publications-heading"
      - label: "Blog"
        href: "#blog-heading"
      - label: "CV"
        href: "{{cv_path}}"
        is_external: true
  
  sections:
    timeline:
      title: "Timeline"
    media:
      title: "Highlights"
    publications:
      title: "Selected Publications"
      note: "Please see my <a href=\"{{google_scholar_url}}\" target=\"_blank\">Google Scholar</a> for a complete list of publications."
    blog:
      title: "🤘 Fablogio"
      subtitle: "Welcome to my space for story telling!"
  
  footer:
    year: 2026
    tagline: "Created entirely by vibe coding and groovy tunes 🤖🎸 • Open source template"
    license_text: "Template by Fabio J. Fehr"
    license_url: "https://github.com/FJFehr/fjfehr.github.io/"

# ===========================
# Contact & Social Links
# ===========================
