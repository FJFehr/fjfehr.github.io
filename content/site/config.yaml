  - name: "YouTube"
    icon: "content/site/icons/youtube-svgrepo-com.svg"
    url: "https://www.youtube.com/@FabioJFehr"
    display: "YouTube"
    is_image: true
  

# ===========================
# Design System
# ===========================
design:
  # Layout dimensions
  layout:
    max_width: 1100px
    padding:
      horizontal: 40px
      vertical: 40px
  
  # Typography
  typography:
    body:
      font_size: 17px
      line_height: 1.6
      font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      color:
        light: "#0a0a0a"
        dark: "#e0e0e0"
    
    heading:
      name:  # Site name in header
        font_size: 32px
        font_weight: 700
        letter_spacing: "-0.02em"
      section_title:  # Section titles (Publications, Contacts, etc.)
        font_size: 28px
        font_weight: 700
    
    links:
      font_size: 14px
      color:
        light: "#666"
        dark: "#a0a0a0"
  
  # Spacing
  spacing:
    header:
      margin_top: 70px
      margin_bottom: 70px
    profile_section:
      margin_top: 40px
      margin_bottom: 40px
      gap: 16px  # Gap between profile image and text
    publication_section:
      margin_top: 40px
      margin_bottom: 40px
      publication_margin_bottom: 12px  # Gap between publication items
    contact_section:
      margin_top: 40px
      margin_bottom: 40px
    footer:
      margin_top: 60px
      padding_bottom: 40px
  
  # Images
  images:
    profile_picture:
      width: 180px
      border_radius: "50%"  # Circular
    publication_thumbnail:
      width: 180px
      height: 180px
      border_radius: "6px"
  
  # Social links styling
  social_links:
    button:
      size: 32px  # Width and height
      border_radius: "50%"  # Circular
    icon:
      width: 18px
      height: 18px
      font_size: 20px  # For emoji icons
    gap: 12px  # Space between buttons
    spacing:
      margin_top: 16px  # Gap between profile picture and social links
  
  # Colors
  colors:
    # ── Change this one line to switch the entire brand colour ──
    active_palette: "violet"  # Options: indigo | violet | teal

    palettes:
      indigo:
        light: { link: "#4f46e5", hover: "#e0e7ff" }
        dark:  { link: "#818cf8", hover: "#2d2a5e" }
      violet:
        light: { link: "#7c3aed", hover: "#ede9fe" }
        dark:  { link: "#a78bfa", hover: "#2e1065" }
      teal:
        light: { link: "#0d9488", hover: "#ccfbf1" }
        dark:  { link: "#2dd4bf", hover: "#042f2e" }

    light_mode:
      background: "#f8f5ee"  # Eggshell — matches CSS --bg-color
      surface: "#f8f5ee"     # Card / input surface — matches CSS --input-bg
      text: "#0a0a0a"
      muted: "#666"
      border: "#e0e0e0"

    dark_mode:
      background: "#1a1a1a"
      surface: "#2a2a2a"     # Card / input surface — matches CSS --input-bg
      text: "#e0e0e0"
      muted: "#a0a0a0"
      border: "#333"

    accent:
      light: { base: "#f59e0b", hover: "#fef3c7" }  # Amber — publication action buttons
      dark:  { base: "#fbbf24", hover: "#451a03" }
  
  # Transitions
  transitions:
    duration: "0.2s"
    easing: "ease"
