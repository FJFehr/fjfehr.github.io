# Media / Highlights
# YouTube videos and media appearances
# Displayed on the homepage in the Highlights section
#
# Supported fields per entry:
#   id          (required) — unique number
#   title       (required) — display title
#   video_id    (required) — YouTube video ID (the part after ?v= in the URL)
#                            Can include a timestamp: "VIDEO_ID?si=TOKEN" or just "VIDEO_ID"
#   timestamp   (optional) — start time in seconds (default: 0)
#   vertical    (optional) — true for 9:16 videos such as YouTube Shorts
#   description (optional) — short description shown below the video

# Example:
# - id: 1
#   title: "My Talk at Conference 2025"
#   video_id: "dQw4w9WgXcQ"
#   timestamp: 0
#   description: "A brief description of what this video is about."
