# Site Configuration
# This file contains all site metadata, layout, contacts, and design settings

# ===========================
# Site Metadata
# ===========================
site:
  name: "YOUR_NAME"
  footer_name: "YOUR_NAME"
  page_title: "YOUR_NAME"      # Browser tab title
  description: ""             # Optional: one line shown in link previews (LinkedIn, WhatsApp, X)
  nationality_flags: ""        # Optional: displayed under profile picture (e.g. "🇺🇸 🇬🇧")
  author_name_pattern: ""      # Pattern to bold in publication author lists (e.g. "A. Author")
  google_scholar_url: ""       # https://scholar.google.com/citations?user=YOUR_ID&hl=en
  cv_path: ""                  # Path to your CV/Resume PDF (e.g. "content/site/YOUR_CV.pdf")
  profile_picture_path: "content/site/profile_picture.jpg"  # Path to your profile picture
  # Optional: per-theme CSS filters on the photo, and an image that slides onto it in dark mode
  # profile_picture_effects:
  #   light_filter: "sepia(0.25) saturate(1.3) brightness(1.08)"
  #   dark_filter: "grayscale(1)"
  #   dark_overlay:
  #     src: "content/site/sunglasses.png"
  #     left: "32%"      # position and width as % of the photo
  #     top: "35%"
  #     width: "43%"
  #     rotate: "0deg"
  site_url: "https://YOUR_USERNAME.github.io"  # Your GitHub Pages URL — no trailing slash (used for OG tags in blog posts)
  # Optional: blog "toast" likes via PostHog. Leave out for no like button. The daily workflow
  # .github/workflows/update-like-counts.yml bakes the counts; it needs the repo secret POSTHOG_API_KEY
  # (a Personal API Key with query read access) and skips itself while project_id is unset.
  # posthog:
  #   key: "phc_YOUR_PROJECT_KEY"    # public project key (safe in the browser)
  #   host: "https://eu.posthog.com" # or https://us.posthog.com
  #   project_id: 12345
  role:
    title: "YOUR_ROLE"         # e.g. "PhD Student", "Software Engineer"
    affiliation: "YOUR_ORG"    # e.g. "MIT", "Google"

# ===========================
# Layout & Navigation
# ===========================
layout:
  header:
    navigation:
      - label: "Experience"
        href: "#timeline"
      - label: "Highlights"
        href: "#media-heading"
      - label: "Publications"
        href: "#publications-heading"
      - label: "Blog"
        href: "#blog-heading"
      - label: "CV"
        href: "{{cv_path}}"
        is_external: true

  sections:
    timeline:
      title: "Timeline"
    media:
      title: "Highlights"
    publications:
      title: "Selected Publications"
      note: "Please see my <a href=\"{{google_scholar_url}}\" target=\"_blank\">Google Scholar</a> for a complete list of publications."
    blog:
      title: "Blog"
      subtitle: "Thoughts and articles"

  footer:
    year: 2025
    tagline: "Open source template"  # optional: leave out for no tagline line
    license_text: "Template by Fabio J. Fehr"
    license_url: "https://github.com/FJFehr/fjfehr.github.io/"

# ===========================
# Contact & Social Links
# ===========================
contacts:
  - name: "Email"
    icon: "✉️"
    url: "mailto:YOUR_EMAIL@example.com"
    display: "YOUR_EMAIL@example.com"

  - name: "Google Scholar"
    icon: "content/site/icons/google-scholar-svgrepo-com.svg"
    url: ""   # https://scholar.google.com/citations?user=YOUR_ID&hl=en
    display: "Google Scholar"
    is_image: true

  - name: "LinkedIn"
    icon: "content/site/icons/linkedin-svgrepo-com.svg"
    url: ""   # https://www.linkedin.com/in/YOUR_HANDLE/
    display: "LinkedIn"
    is_image: true

  - name: "GitHub"
    icon: "content/site/icons/github-svgrepo-com.svg"
    url: ""   # https://github.com/YOUR_USERNAME
    display: "GitHub"
    is_image: true

  - name: "Twitter"
    icon: "𝕏"
    url: ""   # https://twitter.com/YOUR_HANDLE
    display: "Twitter"

  - name: "YouTube"
    icon: "content/site/icons/youtube-svgrepo-com.svg"
    url: ""   # https://www.youtube.com/@YOUR_CHANNEL
    display: "YouTube"
    is_image: true


# ===========================
# Design System
# ===========================
design:
  # Layout dimensions
  layout:
    max_width: 1100px
    padding:
      horizontal: 40px
      vertical: 40px

  # Typography
  typography:
    body:
      font_size: 17px
      line_height: 1.6
      font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      color:
        light: "#0a0a0a"
        dark: "#e0e0e0"

    heading:
      name:  # Site name in header
        font_size: 32px
        font_weight: 700
        letter_spacing: "-0.02em"
      section_title:  # Section titles (Publications, Contacts, etc.)
        font_size: 28px
        font_weight: 700

    links:
      font_size: 14px
      color:
        light: "#666"
        dark: "#a0a0a0"

  # Spacing
  spacing:
    header:
      margin_top: 70px
      margin_bottom: 70px
    profile_section:
      margin_top: 40px
      margin_bottom: 40px
      gap: 16px  # Gap between profile image and text
    publication_section:
      margin_top: 40px
      margin_bottom: 40px
      publication_margin_bottom: 12px  # Gap between publication items
    contact_section:
      margin_top: 40px
      margin_bottom: 40px
    footer:
      margin_top: 60px
      padding_bottom: 40px

  # Images
  images:
    profile_picture:
      width: 180px
      border_radius: "50%"  # Circular
    publication_thumbnail:
      width: 180px
      height: 180px
      border_radius: "6px"

  # Social links styling
  social_links:
    button:
      size: 32px  # Width and height
      border_radius: "50%"  # Circular
    icon:
      width: 18px
      height: 18px
      font_size: 20px  # For emoji icons
    gap: 12px  # Space between buttons
    spacing:
      margin_top: 16px  # Gap between profile picture and social links

  # Colors
  colors:
    # ── Change this one line to switch the entire brand colour ──
    active_palette: "primary"  # Options: primary | indigo | violet | teal

    palettes:
      primary:   # muted teal (AA contrast on its own hover colour)
        light: { link: "#267268", hover: "#DCE9E4" }
        dark:  { link: "#8DC1BA", hover: "#1C2D2A" }
      indigo:
        light: { link: "#4f46e5", hover: "#e0e7ff" }
        dark:  { link: "#818cf8", hover: "#2d2a5e" }
      violet:
        light: { link: "#7c3aed", hover: "#ede9fe" }
        dark:  { link: "#a78bfa", hover: "#2e1065" }
      teal:
        light: { link: "#0d9488", hover: "#ccfbf1" }
        dark:  { link: "#2dd4bf", hover: "#042f2e" }

    light_mode:
      background: "#f8f5ee"  # Eggshell — matches CSS --bg-color
      surface: "#f8f5ee"     # Card / input surface — matches CSS --input-bg
      text: "#0a0a0a"
      muted: "#666"
      border: "#e0e0e0"

    dark_mode:
      background: "#1a1a1a"
      surface: "#2a2a2a"     # Card / input surface — matches CSS --input-bg
      text: "#e0e0e0"
      muted: "#a0a0a0"
      border: "#333"

  # Transitions
  transitions:
    duration: "0.2s"
    easing: "ease"
