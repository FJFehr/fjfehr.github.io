# Timeline Events
# Chronological list of work experience and education
# Displayed on the homepage in the Timeline section
#
# Supported fields per entry:
#   id           (required) — unique string identifier
#   type         (required) — "work" or "education"
#   title        (required) — job title or degree name
#   organization (required) — company or institution name
#   location     (optional) — city, country
#   url          (optional) — link to organisation website
#   start_date   (required) — YYYY-MM format
#   end_date     (required) — YYYY-MM format or "present"
#   description  (optional) — markdown-supported description
#   logo         (optional) — path to logo image (SVG or PNG in content/timeline/logos/)
#   logo_dark    (optional) — logo variant shown in dark mode (e.g. dark text made white)

# Example:
# - id: "my-job"
#   type: "work"
#   title: "Software Engineer"
#   organization: "My Company"
#   location: "San Francisco, USA"
#   url: "https://mycompany.com"
#   start_date: "2022-01"
#   end_date: "present"
#   description: "Description of your role and achievements."
#   logo: "content/timeline/logos/mycompany.svg"
#
# - id: "my-degree"
#   type: "education"
#   title: "BSc in Computer Science"
#   organization: "My University"
#   location: "Boston, USA"
#   url: "https://myuniversity.edu"
#   start_date: "2018-09"
#   end_date: "2022-06"
#   description: "Thesis: Your thesis title here."
#   logo: "content/timeline/logos/myuniversity.svg"
